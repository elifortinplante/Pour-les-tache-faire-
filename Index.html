<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tâches du jour</title>
<style>
:root{--bg:#fffaf0;--ink:#1d1d1f;--card:#fff;--line:#1d1d1f;--ok:#c9f0c4;--muted:#6b6b70;--acc:#ff8a3d;--onink:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17171a;--ink:#f3f3f5;--card:#232328;--line:#f3f3f5;--ok:#2f5a2c;--muted:#a0a0a8;--onink:#17171a}}
:root[data-theme="dark"]{--bg:#17171a;--ink:#f3f3f5;--card:#232328;--line:#f3f3f5;--ok:#2f5a2c;--muted:#a0a0a8;--onink:#17171a}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Marker Felt","Segoe Print","Comic Sans MS",ui-rounded,system-ui,sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:480px;height:100%;display:flex;flex-direction:column;padding:0 16px}
header{display:flex;align-items:center;justify-content:center;position:relative;padding:18px 0 8px;border-bottom:2px solid var(--line);margin-bottom:18px}
h1{margin:0;font-size:2rem;font-weight:600}
.round{width:44px;height:44px;border-radius:50%;border:2.5px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-size:1.7rem;line-height:1;cursor:pointer;display:grid;place-items:center}
#addToday{position:absolute;right:0;top:14px}
main{flex:1;overflow-y:auto;padding-bottom:12px}
.pill{display:flex;align-items:center;gap:12px;width:100%;border:2.5px solid var(--line);border-radius:999px;padding:12px 16px;margin:0 0 14px;background:var(--card);color:var(--ink);font:inherit;font-size:1.3rem;text-align:left;cursor:pointer;min-height:64px}
.pill.done{background:var(--ok)}
.pill .t{flex:1;text-align:center;word-break:break-word}
.pill small{display:block;font-size:.85rem;color:var(--muted)}
.pill.done .t b{text-decoration:line-through;text-decoration-thickness:2px;font-weight:400}
.face{font-size:1.9rem;line-height:1;flex:none;width:40px;height:40px;border:2.5px solid var(--line);border-radius:50%;display:grid;place-items:center}
.del{flex:none;border:0;background:none;color:var(--muted);font-size:1.1rem;cursor:pointer;padding:4px}
#pct{justify-content:center;font-size:2.4rem;cursor:default;width:60%;margin:0 auto 10px;min-height:76px}
.bar{height:10px;border-radius:99px;background:var(--card);border:2px solid var(--line);overflow:hidden;width:60%;margin:0 auto 22px}
.bar i{display:block;height:100%;background:var(--acc);transition:width .3s}
.empty{text-align:center;color:var(--muted);font-size:1.2rem;margin-top:30px}
nav{display:flex;justify-content:space-around;align-items:center;padding:10px 0 12px;border-top:2px solid var(--line)}
nav .round{width:56px;height:56px;font-size:1.8rem;border-width:3px;border-color:transparent}
nav .round.on{border-color:var(--line);background:var(--acc);color:#1d1d1f}
.card{border:2.5px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:14px;background:var(--card)}
.card .top{display:flex;justify-content:space-between;align-items:flex-start;font-size:1.35rem;margin-bottom:12px}
.card .top small{display:block;font-size:.85rem;color:var(--muted)}
.edit{border:0;background:none;font-size:1.4rem;cursor:pointer;padding:0 4px;color:var(--ink)}
.days{display:flex;gap:6px;justify-content:space-between}
.d{flex:1;max-width:46px;aspect-ratio:1;border:2.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:1.15rem;cursor:pointer;border-radius:4px;padding:0}
.d.on{background:var(--ink);color:var(--onink)}
.sec{margin-bottom:18px}
.sec h3{margin:0 0 8px;font-size:1.25rem;display:flex;align-items:center;gap:10px;font-weight:600}
.sec h3 span{border:2.5px solid var(--line);width:30px;height:30px;display:grid;place-items:center;font-size:1rem}
.txt{width:100%;font:inherit;font-size:1.2rem;padding:12px 14px;border:2.5px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink)}
.seg{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg button{font:inherit;font-size:1.1rem;padding:10px 18px;border:2.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;border-radius:4px}
.seg button.on{background:var(--ink);color:var(--onink)}
.seg input{font:inherit;font-size:1.1rem;padding:8px;border:2.5px solid var(--line);border-radius:4px;background:var(--card);color:var(--ink)}
.chk{display:flex;gap:12px;align-items:center;font-size:1.05rem;cursor:pointer}
.chk i{flex:none;width:34px;height:34px;border:2.5px solid var(--line);border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:1.2rem}
.note{font-size:.8rem;color:var(--muted);margin-top:6px}
.big{display:block;margin:22px auto 8px;font:inherit;font-size:1.3rem;padding:12px 26px;border:2.5px solid var(--line);background:var(--acc);color:#1d1d1f;cursor:pointer;border-radius:4px}
.link{display:block;margin:6px auto;border:0;background:none;color:var(--muted);font:inherit;font-size:1rem;text-decoration:underline;cursor:pointer}
#modal,#cmodal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:5}
#modal.show,#cmodal.show{display:flex}
.sheet{background:var(--bg);width:100%;max-width:480px;border-radius:26px 26px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom,0px));border:2.5px solid var(--line)}
.sheet h2{margin:0 0 4px;font-size:1.4rem}
.sheet p{margin:0 0 14px;color:var(--muted);font-size:1rem}
.sheet .txt{border-radius:999px;margin-bottom:12px}
.row{display:flex;gap:10px}
.row button{flex:1;font:inherit;font-size:1.15rem;padding:12px;border-radius:999px;border:2.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.row .go{background:var(--acc);color:#1d1d1f}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1 id="title">Samedi</h1>
    <button class="round" id="addToday" aria-label="Ajouter une tâche seulement pour aujourd’hui">+</button>
  </header>
  <main id="main"></main>
  <nav>
    <button class="round" id="navToday" aria-label="Aujourd’hui">☀️</button>
    <button class="round" id="navHab" aria-label="Habitudes">🏅</button>
    <button class="round" id="navAdd" aria-label="Ajouter une habitude">+</button>
  </nav>
</div>
<div id="modal">
  <div class="sheet">
    <h2>Nouvelle tâche</h2>
    <p>Seulement pour aujourd’hui</p>
    <input class="txt" id="mInput" maxlength="60" placeholder="Ex. : Ranger ma chambre" autocomplete="off">
    <div class="row"><button id="mCancel">Annuler</button><button class="go" id="mOk">Ajouter</button></div>
  </div>
</div>
<div id="cmodal">
  <div class="sheet">
    <h2 id="cMsg">Supprimer ?</h2>
    <p>Cette action est définitive.</p>
    <div class="row"><button id="cNo">Annuler</button><button class="go" id="cYes">Supprimer</button></div>
  </div>
</div>
<script>
var KEY="taches-du-jour-v2",ALL=[0,1,2,3,4,5,6];
var S={habits:[{id:"h1",t:"Devoir",days:ALL.slice(),plan:"flex",time:"",block:false},{id:"h2",t:"Faire son lit",days:ALL.slice(),plan:"flex",time:"",block:false}],once:{},done:{}};
try{var raw=localStorage.getItem(KEY);if(raw){var p=JSON.parse(raw);if(p&&p.habits)S=p}else{
 var old=localStorage.getItem("taches-du-jour-v1");if(old){var o=JSON.parse(old);if(o&&o.routine){S={habits:o.routine.map(function(x){return{id:x.id,t:x.t,days:ALL.slice(),plan:"flex",time:"",block:false}}),once:o.once||{},done:o.done||{}}}}}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
var DAYS=["Dimanche","Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi"],L=["D","L","M","M","J","V","S"];
function ds(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
var now=new Date(),TD=ds(now),WD=now.getDay(),view="today",editId=null,F=null;
function tasks(){var a=S.habits.filter(function(h){return h.days.indexOf(WD)>-1}).map(function(h){return{id:h.id,t:h.t,time:h.plan==="time"?h.time:"",r:0}});
 a.sort(function(x,y){return(x.time||"zz")<(y.time||"zz")?-1:1});
 return a.concat((S.once[TD]||[]).map(function(x){return{id:x.id,t:x.t,time:"",r:1}}))}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function toggle(id){var d=S.done[TD]=S.done[TD]||[],i=d.indexOf(id);if(i>-1)d.splice(i,1);else d.push(id);save();render()}
function ask(msg,cb){document.getElementById("cMsg").textContent=msg;var m=document.getElementById("cmodal");m.classList.add("show");document.getElementById("cNo").onclick=function(){m.classList.remove("show")};document.getElementById("cYes").onclick=function(){m.classList.remove("show");cb()}}
function delOnce(id){ask("Supprimer cette tâche ?",function(){S.once[TD]=(S.once[TD]||[]).filter(function(x){return x.id!==id});save();render()})}
function dayBtns(sel,attr){return L.map(function(l,i){return'<button class="d'+(sel.indexOf(i)>-1?" on":"")+'" '+attr+'="'+i+'" aria-label="'+DAYS[i]+'">'+l+'</button>'}).join("")}
function render(){
 var m=document.getElementById("main"),h="",t=document.getElementById("title");
 document.getElementById("addToday").style.visibility=view==="today"?"visible":"hidden";
 document.getElementById("navToday").className="round"+(view==="today"?" on":"");
 document.getElementById("navHab").className="round"+(view==="habits"?" on":"");
 document.getElementById("navAdd").className="round"+(view==="form"?" on":"");
 if(view==="today"){
  t.textContent=DAYS[WD];
  var ts=tasks(),d=S.done[TD]||[],n=ts.filter(function(x){return d.indexOf(x.id)>-1}).length,p=ts.length?Math.round(n*100/ts.length):0;
  h+='<div class="pill" id="pct">'+p+'%</div><div class="bar"><i style="width:'+p+'%"></i></div>';
  if(!ts.length)h+='<div class="empty">Aucune tâche aujourd’hui.<br>Appuie sur + pour en ajouter !</div>';
  ts.forEach(function(x){var ok=d.indexOf(x.id)>-1;
   h+='<div class="pill'+(ok?" done":"")+'" role="button" tabindex="0" data-id="'+x.id+'">'+(ok?'':'<span class="face">😟</span>')+'<span class="t"><b>'+esc(x.t)+'</b>'+(x.time?'<small>'+esc(x.time)+'</small>':'')+'</span>'+(ok?'<span class="face">😊</span>':'')+(x.r?'<button class="del" data-del="'+x.id+'" aria-label="Supprimer">✕</button>':'')+'</div>'});
 }else if(view==="habits"){
  t.textContent="Habitude";
  if(!S.habits.length)h+='<div class="empty">Aucune habitude.<br>Appuie sur + en bas pour en créer une !</div>';
  S.habits.forEach(function(x){h+='<div class="card"><div class="top"><div>'+esc(x.t)+'<small>'+(x.plan==="time"&&x.time?"à "+esc(x.time):"Flexible")+(x.block?" · 🔒 apps bloquées":"")+'</small></div><button class="edit" data-edit="'+x.id+'" aria-label="Modifier">✏️</button></div><div class="days">'+dayBtns(x.days,'data-hd="'+x.id+'" data-d')+'</div></div>'});
 }else{
  t.textContent=editId?"Modifier l’habitude":"Ajouter une habitude";
  h+='<div class="sec"><h3><span>1</span>Nom de l’habitude</h3><input class="txt" id="fName" maxlength="60" value="'+esc(F.t)+'"></div>';
  h+='<div class="sec"><h3><span>2</span>Planification</h3><div class="seg"><button data-plan="flex" class="'+(F.plan==="flex"?"on":"")+'">Flexible</button><button data-plan="time" class="'+(F.plan==="time"?"on":"")+'">Heure</button>'+(F.plan==="time"?'<input type="time" id="fTime" value="'+esc(F.time)+'">':'')+'</div></div>';
  h+='<div class="sec"><h3><span>3</span>Bloquer</h3><div class="chk" id="fBlock"><span>Bloquer les apps sélectionnées si cette tâche n’est pas terminée</span><i>'+(F.block?"✓":"")+'</i></div><div class="note">Le blocage réel des apps demande une app installée sur le téléphone ; ici, le choix est seulement enregistré.</div></div>';
  h+='<div class="sec"><h3><span>4</span>Jours de la semaine</h3><div class="days">'+dayBtns(F.days,'data-fd')+'</div></div>';
  h+='<button class="big" id="fSave">'+(editId?"Enregistrer":"Ajouter l’habitude")+'</button>';
  if(editId)h+='<button class="link" id="fDel">Supprimer cette habitude</button>';
 }
 m.innerHTML=h;
}
function readForm(){var n=document.getElementById("fName");if(n)F.t=n.value;var t=document.getElementById("fTime");if(t)F.time=t.value}
function openForm(id){editId=id;var h=S.habits.filter(function(x){return x.id===id})[0];F=h?JSON.parse(JSON.stringify(h)):{t:"",plan:"flex",time:"",block:false,days:ALL.slice()};view="form";render()}
document.getElementById("main").addEventListener("click",function(e){
 var g=function(s){return e.target.closest(s)};var x;
 if(view==="today"){if(x=g("[data-del]")){e.stopPropagation();delOnce(x.dataset.del);return}if(x=g("[data-id]"))toggle(x.dataset.id);return}
 if(view==="habits"){
  if(x=g("[data-edit]")){openForm(x.dataset.edit);return}
  if(x=g("[data-hd]")){var h=S.habits.filter(function(k){return k.id===x.dataset.hd})[0],i=+x.dataset.d,j=h.days.indexOf(i);if(j>-1)h.days.splice(j,1);else h.days.push(i);save();render()}return}
 readForm();
 if(x=g("[data-plan]")){F.plan=x.dataset.plan;render();return}
 if(g("#fBlock")){F.block=!F.block;render();return}
 if(x=g("[data-fd]")){var i2=+x.dataset.fd,j2=F.days.indexOf(i2);if(j2>-1)F.days.splice(j2,1);else F.days.push(i2);render();return}
 if(g("#fDel")){var did=editId;ask("Supprimer cette habitude ?",function(){S.habits=S.habits.filter(function(k){return k.id!==did});save();view="habits";editId=null;render()});return}
 if(g("#fSave")){var nm=F.t.trim();if(!nm){document.getElementById("fName").focus();return}
  F.t=nm;if(F.plan==="flex")F.time="";
  if(editId){S.habits=S.habits.map(function(k){return k.id===editId?Object.assign({id:editId},F):k})}else S.habits.push(Object.assign({id:"h"+Date.now()},F));
  save();view="habits";editId=null;render()}
});
function go(v){view=v;editId=null;if(v==="form")openForm(null);else render()}
document.getElementById("navToday").onclick=function(){go("today")};
document.getElementById("navHab").onclick=function(){go("habits")};
document.getElementById("navAdd").onclick=function(){go("form")};
function openM(){var i=document.getElementById("mInput");i.value="";document.getElementById("modal").classList.add("show");setTimeout(function(){i.focus()},50)}
function closeM(){document.getElementById("modal").classList.remove("show")}
function addOnce(){var v=document.getElementById("mInput").value.trim();if(!v)return;(S.once[TD]=S.once[TD]||[]).push({id:"t"+Date.now(),t:v});save();closeM();render()}
document.getElementById("addToday").onclick=openM;
document.getElementById("mCancel").onclick=closeM;
document.getElementById("mOk").onclick=addOnce;
document.getElementById("mInput").addEventListener("keydown",function(e){if(e.key==="Enter")addOnce()});
document.getElementById("modal").addEventListener("click",function(e){if(e.target.id==="modal")closeM()});
render();
</script>
</body>
</html>
